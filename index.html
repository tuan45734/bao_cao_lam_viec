<!-- index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Báo cáo Chấm công & Viếng thăm - Mobiwork (2 cột)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 BÁO CÁO CHẤM CÔNG & VIẾNG THĂM</h1>
        <div class="date">Hệ thống báo cáo | Cập nhật: <span id="currentDate"></span></div>
    </div>

    <div class="filter-section">
        <div class="filter-group">
            <label>📅 Từ ngày</label>
            <input type="date" id="fromDate" value="2026-04-01">
        </div>
        <div class="filter-group">
            <label>📅 Đến ngày</label>
            <input type="date" id="toDate" value="2026-04-05">
        </div>
        <div class="filter-group">
            <label>🏢 Khu vực</label>
            <select id="areaFilter"><option value="all">Tất cả</option></select>
        </div>
        <div class="filter-group">
            <label>👤 Nhân viên</label>
            <select id="employeeFilter"><option value="all">Tất cả</option></select>
        </div>
        <button class="btn btn-primary" id="loadReportBtn">🔍 Xem báo cáo</button>
        <button class="btn btn-secondary" id="exportExcelBtn">📥 Xuất Excel</button>
    </div>

    <div class="progress-container" id="progressContainer" style="display: none;">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">Đang tải dữ liệu...</div>
    </div>

    <!-- Bảng báo cáo CHÍNH: 2 cột rõ ràng -->
    <div id="detailTab" class="tab-content active">
        <div id="detailContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Vui lòng nhấn "Xem báo cáo" để tải dữ liệu...</p>
            </div>
        </div>
    </div>
</div>

<script src="visitData.js"></script>
<script src="script.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="excelExport.js"></script>
</body>
</html>
