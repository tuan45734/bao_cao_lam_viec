<!-- index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Báo cáo Chấm công & Viếng thăm - Mobiwork</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 BÁO CÁO CHẤM CÔNG & VIẾNG THĂM</h1>
        <div class="date">Hệ thống báo cáo | Cập nhật: <span id="currentDate"></span></div>
    </div>

    <div class="filter-section">
        <div class="filter-group">
            <label>📅 Từ ngày</label>
            <input type="date" id="fromDate">
        </div>
        <div class="filter-group">
            <label>📅 Đến ngày</label>
            <input type="date" id="toDate">
        </div>
        <div class="filter-group">
            <label>🏢 Khu vực</label>
            <select id="areaFilter"><option value="all">Tất cả</option></select>
        </div>
        <div class="filter-group">
            <label>🏪 NPP</label>
            <select id="nppFilter"><option value="all">Tất cả</option></select>
        </div>
        <div class="filter-group">
            <label>👤 Nhân viên</label>
            <select id="employeeFilter"><option value="all">Tất cả</option></select>
        </div>
        <button class="btn btn-primary" id="loadReportBtn">🔍 Xem báo cáo</button>
        <button class="btn btn-secondary" id="exportExcelBtn">📥 Xuất Excel</button>
    </div>

    <div class="progress-container" id="progressContainer" style="display: none;">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">Đang tải dữ liệu...</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="detail">📋 Chi tiết (Bảng dữ liệu)</button>
        <button class="tab-btn" data-tab="overview">📊 Tổng quan (Biểu đồ)</button>
    </div>

    <div id="detailTab" class="tab-content active">
        <div id="detailContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Đang tải...</p>
            </div>
        </div>
    </div>

    <div id="overviewTab" class="tab-content" style="display:none;">
        <div id="overviewContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Đang tải...</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="visitData.js"></script>
<script src="js/login.js"></script>
<script src="js/main.js"></script>
<script src="js/filters.js"></script>
<script src="js/detailTab.js"></script>
<script src="js/overviewTab.js"></script>

<script>
    // Khởi động kiểm tra đăng nhập (KHÔNG tự động load báo cáo)
    function toDateInputValue(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date();
        const firstOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        document.getElementById('fromDate').value = toDateInputValue(firstOfMonth);
        document.getElementById('toDate').value = toDateInputValue(today);
        document.getElementById('currentDate').innerText = today.toLocaleString('vi-VN');
        // Hiển thị thông báo chờ đăng nhập
        document.getElementById('detailContent').innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Vui lòng đăng nhập để sử dụng hệ thống</p>
            </div>
        `;
        checkSessionAndInit();
    });
</script>
</body>
</html>
